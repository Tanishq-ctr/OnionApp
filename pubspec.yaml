name: onion_app
description: AI-powered onion quality grading application using dual YOLOv8 TFLite models.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5
  tflite_flutter: ^0.12.1
  image: ^4.1.3
  path_provider: ^2.1.1
  pdf: ^3.10.7
  printing: ^5.11.1
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/veg_model.tflite
    - assets/onion2_model.tflite
    - assets/veg_model.txt
    - assets/onion2_model.txt
